<figure>
  @let imagen = foto();
  @let estadoFoto = estado();
  @let lista = imagen && estadoFoto?.foto === imagen && estadoFoto?.disponible;
  @let fallo = imagen && estadoFoto?.foto === imagen && !estadoFoto?.disponible;
  @if (imagen && !fallo) {
    <div class="foto-grabado" [attr.aria-busy]="!lista">
      <img [src]="imagen" [alt]="'Fotografía de ' + nombre()" width="400" height="400" loading="lazy"
        (load)="actualizarFoto(imagen, true)" (error)="actualizarFoto(imagen, false)" />
      @if (!lista) { <p class="cargando" role="status">Cargando fotografía…</p> }
      @if (lista && grabado() && zonaVisible(); as area) {
        <div aria-hidden="true" class="capa-grabado"
          [style.left.%]="area.x" [style.top.%]="area.y" [style.width.%]="area.ancho"
          [style.height.%]="area.alto" [style.font-size]="tamano() + 'cqw'" [style.color]="area.color">
          <span>{{ grabado() }}</span>
        </div>
        @if (area.adorno) {
          <svg class="adorno-grabado" aria-hidden="true" viewBox="0 0 240 30" fill="none" [style.color]="area.color">
            <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M104 18Q88 4 65 13T10 16M136 18Q152 4 175 13T230 16" />
              <path fill="currentColor" d="M78 11Q68 6 64 2Q74 2 78 11ZM59 15Q49 12 43 7Q55 7 59 15ZM41 19Q29 17 24 11Q35 11 41 19ZM57 17Q49 25 40 26Q44 20 57 17ZM76 12Q70 23 61 24Q64 16 76 12Z
                M162 11Q172 6 176 2Q166 2 162 11ZM181 15Q191 12 197 7Q185 7 181 15ZM199 19Q211 17 216 11Q205 11 199 19ZM183 17Q191 25 200 26Q196 20 183 17ZM164 12Q170 23 179 24Q176 16 164 12Z" />
              <path d="M120 25C116 19 109 15 109 9C109 3 117 2 120 8C123 2 131 3 131 9C131 15 124 19 120 25Z" />
            </g>
          </svg>
        }
      }
    </div>
  } @else {
    <p class="estado-foto" role="status">Fotografía no disponible para {{ nombre() }}.</p>
  }

  @if (grabado()) {
    @if (!zonaVisible() || !imagen || fallo) {
      <div class="muestra-generica">
        <p>Muestra de texto separada. La fotografía no permite simular este grabado con claridad.</p>
        <p class="texto-completo">{{ grabado() }}</p>
      </div>
    } @else {
      <span class="sr-only">Texto de grabado: {{ grabado() }}</span>
    }
  }
  @if (permite()) {
    <figcaption>Vista previa ilustrativa. El grabado final puede variar.</figcaption>
  }
</figure>
