<div class="min-h-screen bg-crema">
  <header class="bg-white shadow-sm">
    <nav class="mx-auto flex max-w-7xl items-center justify-between p-5">
      <a routerLink="/" class="font-brand text-2xl font-bold text-nogal">
        Toco Madera
      </a>

      <a routerLink="/admin/dashboard" class="text-sm text-terracota">
        Vista de administración (prueba)
      </a>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-16">
    <section class="mb-16 text-center">
      <h1 class="mb-5 font-brand text-5xl font-bold text-nogal">
        {{ nombreEmpresa }}
      </h1>

      <p class="mb-6 text-2xl text-terracota">{{ eslogan }}</p>

      <p class="mx-auto max-w-2xl text-lg">
        Fabricamos artículos de madera personalizados mediante grabado
        artesanal.
      </p>
    </section>

    <h2 class="mb-8 text-3xl font-bold text-nogal">Nuestros productos</h2>

    <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (producto of productos; track producto) {
      <article class="rounded-xl bg-white p-6 shadow-sm">
        <h3 class="mb-3 text-xl font-semibold text-nogal">{{ producto }}</h3>

        <p class="text-sm text-gray-600">Artículo artesanal personalizable.</p>
      </article>
      }
    </section>
  </main>
</div>
