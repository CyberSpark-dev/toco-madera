<div class="admin-layout min-h-screen bg-crema" (keydown.escape)="cerrarConEscape($event)">
  <header class="admin-mobile flex items-center justify-between gap-3 border-b border-white/20 bg-nogal px-4 py-3 text-white">
    <app-identidad-toco-madera [administrativa]="true" />
    <button
      #menuButton
      type="button"
      class="admin-focus inline-flex min-h-11 items-center gap-2 rounded-lg border border-white/60 px-3 text-sm font-semibold hover:bg-white/10"
      aria-controls="admin-navegacion"
      [attr.aria-expanded]="menuAbierto()"
      (click)="menuAbierto.set(!menuAbierto())"
    >
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path [attr.d]="menuAbierto() ? 'M6 6l12 12M18 6 6 18' : 'M3 6h18M3 12h18M3 18h18'" />
      </svg>
      {{ menuAbierto() ? 'Cerrar menú' : 'Menú' }}
    </button>
  </header>

  <aside id="admin-navegacion" class="admin-sidebar bg-nogal text-white" [class.menu-abierto]="menuAbierto()">
    <div class="admin-marca items-center gap-3 border-b border-white/20 px-5 py-5">
      <div><app-identidad-toco-madera [administrativa]="true" />
        <p class="text-xs text-[#F9E9D5]">Administración</p>
      </div>
    </div>
    <nav aria-label="Navegación de administración" class="space-y-4 px-3 py-4">
      @for (grupo of grupos; track grupo.titulo) {
        <div>
          <p class="px-3 pb-1.5 text-xs font-semibold uppercase tracking-wide text-[#F9E9D5]">{{ grupo.titulo }}</p>
          <ul class="space-y-1">
            @for (enlace of grupo.enlaces; track enlace.ruta) {
              <li>
                <a
                  [routerLink]="['/admin', enlace.ruta]"
                  routerLinkActive="admin-activo"
                  ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
                  class="admin-focus flex min-h-10 items-center gap-3 rounded-lg px-3 py-2 text-sm hover:bg-white/10"
                  (click)="cerrarMenuAlNavegar($event)"
                >
                  <svg aria-hidden="true" class="shrink-0" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
                    <path [attr.d]="enlace.icono" />
                  </svg>
                  {{ enlace.etiqueta }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
    <div class="grid gap-2 border-t border-white/20 p-3 text-sm font-semibold">
      <a routerLink="/" class="admin-focus rounded-lg px-3 py-2 hover:bg-white/10">Volver a tienda</a>
      <button type="button" class="admin-focus rounded-lg border border-white/40 px-3 py-2 text-left hover:bg-white/10" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <div #contenido tabindex="-1" class="admin-contenido min-w-0">
    <router-outlet />
  </div>
</div>
